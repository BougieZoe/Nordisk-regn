function makeWoodTex() {
  const S = 256, c = document.createElement('canvas'); c.width = c.height = S
  const ctx = c.getContext('2d')
  ctx.fillStyle = '#D8C3A5'; ctx.fillRect(0, 0, S, S)
  const d = ctx.getImageData(0, 0, S, S), pix = d.data
  for (let y = 0; y < S; y++) {
    for (let x = 0; x < S; x++) {
      const i = (y * S + x) * 4
      const grain = Math.sin(x * 0.7 + y * 0.015) * 4 +
                    Math.sin(x * 1.5 + y * 0.008) * 2.5 +
                    Math.sin(x * 3.0 + y * 0.005) * 1.5
      const ring = Math.sin(y * 0.04 + Math.sin(x * 0.06) * 3) * 3
      const noise = (Math.random() - 0.5) * 2
      const shift = grain + ring + noise
      pix[i]   = Math.max(0, Math.min(255, pix[i]   + shift))
      pix[i+1] = Math.max(0, Math.min(255, pix[i+1] + shift * 0.9))
      pix[i+2] = Math.max(0, Math.min(255, pix[i+2] + shift * 0.7))
    }
  }
  ctx.putImageData(d, 0, 0)
  // Soft knots
  for (let k = 0; k < 2; k++) {
    const kx = Math.random()*S, ky = Math.random()*S, r = 4+Math.random()*6
    const g = ctx.createRadialGradient(kx,ky,0,kx,ky,r)
    g.addColorStop(0, 'rgba(190,168,140,0.25)'); g.addColorStop(.5,'rgba(200,180,155,0.1)'); g.addColorStop(1,'rgba(0,0,0,0)')
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(kx,ky,r,0,6.28); ctx.fill()
  }
  const t = new THREE.CanvasTexture(c)
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(2.5, 1.2); t.anisotropy = 4
  return t
}

]

const keyTopMat = new THREE.MeshStandardMaterial({ color: 0x4a86e8, roughness: .4 })

// ─── AUDIO ───
const AUD = { ctx: null, gain: null, on: false,
  init() {
    if (this.ctx) return
    try {
      this.ctx = new AudioContext(); this.gain = this.ctx.createGain(); this.gain.gain.value = .04
      this.gain.connect(this.ctx.destination)
      const mk = (lo,hi,g,q) => {
        const sr = this.ctx.sampleRate, L = sr*4, b = this.ctx.createBuffer(1,L,sr), d = b.getChannelData(0)
        for (let i = 0; i < L; i++) d[i] = Math.random()*2-1
        const s = this.ctx.createBufferSource(); s.buffer = b; s.loop = true
        const bp = this.ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = (lo+hi)/2; bp.Q.value = q
        const lp = this.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = hi*1.4
        const hp = this.ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = lo*.5
        s.connect(bp); bp.connect(lp); lp.connect(hp); hp.connect(this.gain); s.start()
      }
      mk(500,1500,.4,1.2); mk(150,400,.15,.8); mk(2500,5000,.08,.6); mk(200,800,.2,.5)
      this.on = true
    } catch(e) { console.warn(e) }
  },
  setVol(v) { if (this.gain) this.gain.gain.value = v * .14 },
  toggle() { if (!this.ctx) return; this.on = !this.on; this.gain.gain.value = this.on ? .04 : 0; return this.on }
}
document.getElementById('playbtn').onclick = function() { this.textContent = AUD.toggle() ? '❚❚' : '▶' }
document.getElementById('vol').oninput = function() { AUD.setVol(this.value/100) }

// ─── DESK FOCUS: glide to the ThinkPad and type on it ───
window.__typed = ''
const RAY = new THREE.Raycaster(), PTR = new THREE.Vector2()
const HOME_POS = CAM.position.clone(), HOME_TGT = new THREE.Vector3(.05, .75, 0)
const DESK_POS = new THREE.Vector3(LX, .93, 2.02), DESK_TGT = new THREE.Vector3(LX, .855, 1.40)
const lookCur = HOME_TGT.clone()
let camGoal = null, deskMode = false
// orbit state (spherical around lookCur), goals ease toward targets every frame
function sph(p, t) { const o = p.clone().sub(t); return { r: o.length(), th: Math.atan2(o.x, o.z), ph: Math.acos(Math.min(1, Math.max(-1, o.y / (o.length() || 1)))) } }
const _h = sph(HOME_POS, HOME_TGT), _d = sph(DESK_POS, DESK_TGT)
const orb = { r: _h.r, th: _h.th, ph: _h.ph }
const orbG = { r: _h.r, th: _h.th, ph: _h.ph }
const TGTBOX = { x0: -.45, x1: .35, y0: .55, y1: 1.05, z0: 1.1, z1: 1.7 }
function clampTgt(v) { v.x = Math.min(TGTBOX.x1, Math.max(TGTBOX.x0, v.x)); v.y = Math.min(TGTBOX.y1, Math.max(TGTBOX.y0, v.y)); v.z = Math.min(TGTBOX.z1, Math.max(TGTBOX.z0, v.z)); return v }
function applyOrbit() {
  const sp = Math.sin(orb.ph), x = orb.r * sp * Math.sin(orb.th), y = orb.r * Math.cos(orb.ph), z = orb.r * sp * Math.cos(orb.th)
  CAM.position.set(lookCur.x + x, lookCur.y + y, lookCur.z + z)
}
const lookG = HOME_TGT.clone()
// stay in the open front hemisphere: never behind the lid, walls or curtain
const TH0 = -1.0, TH1 = 1.0, PH0 = .15, PH1 = 1.53, R0 = .35, R1 = 2.2
function clampOrb() {
  orbG.th = Math.min(TH1, Math.max(TH0, orbG.th))
  orb.th = Math.min(TH1, Math.max(TH0, orb.th))
  orbG.ph = Math.min(PH1, Math.max(PH0, orbG.ph))
  orb.ph = Math.min(PH1, Math.max(PH0, orb.ph))
  orbG.r = Math.min(R1, Math.max(R0, orbG.r))
  orb.r = Math.min(R1, Math.max(R0, orb.r))
}
function goOrbitPos(p, t) {
  const g = sph(p, t)
  let dth = (g.th - orbG.th) % (Math.PI * 2)
  if (dth > Math.PI) dth -= Math.PI * 2
  if (dth < -Math.PI) dth += Math.PI * 2
  orbG.th += dth; orbG.ph = g.ph; orbG.r = g.r
  clampOrb()
  lookG.copy(t)
}
const HOME_TGT0 = HOME_TGT.clone()
window.__orbitTo = (th, ph, r) => { orbG.th = th; orbG.ph = ph; orbG.r = r; clampOrb(); camGoal = 'orbit' }
applyOrbit()
const LAPBOX = { x0: -.30, x1: .16, y0: .72, y1: 1.05, z0: 1.22, z1: 1.66 }
function inLap(p) { return p && p.x > LAPBOX.x0 && p.x < LAPBOX.x1 && p.y > LAPBOX.y0 && p.y < LAPBOX.y1 && p.z > LAPBOX.z0 && p.z < LAPBOX.z1 }
function goDesk() { deskMode = true; goOrbitPos(DESK_POS, DESK_TGT); camGoal = 'orbit'; toast('⌨️ 直接打字上屏 · 输入 bougiezoe 有惊喜 · Esc 回房间') }
function goRoom() { deskMode = false; window.__typed = ''; goOrbitPos(HOME_POS, HOME_TGT0); camGoal = 'orbit' }
let lastHit = null
function pick(cx, cy) {
  PTR.set(cx / innerWidth * 2 - 1, -(cy / innerHeight) * 2 + 1)
  RAY.setFromCamera(PTR, CAM)
  const h = RAY.intersectObjects(RM.children.filter(m => !m.isPoints), true)[0]
  lastHit = h || null
  return h ? h.point : null
}
function keyOf(o) { while (o) { if (o.userData && o.userData.code) return o; o = o.parent } return null }
function pressCode(code, mesh) {
  lastUser = Date.now() / 1000
  if (mesh && !(code in keyByCode)) {
    mesh.userData.dip = 1
    if (code !== 'Trackpad' && code !== 'ClickBtn') return
    return
  }
  if (code === 'Backspace') { window.__typed = window.__typed.slice(0, -1); dipKey('Backspace') }
  else if (code === 'Enter') commitLine()
  else if (code.length === 1 && window.__typed.length < 38) { window.__typed += code === ' ' ? ' ' : code.toLowerCase(); dipKey(code === ' ' ? ' ' : code.toLowerCase()) }
  else dipKey(code)
  if (mesh && (code in keyByCode)) { mesh.userData.dip = 1; return }
}
window.__desk = () => deskMode
R.domElement.style.touchAction = 'none'
R.domElement.addEventListener('contextmenu', (e) => e.preventDefault())
R.domElement.addEventListener('dblclick', () => { if (deskMode) goRoom() })
const ptrs = new Map()
let downAt = null
R.domElement.addEventListener('pointerdown', (e) => {
  ptrs.set(e.pointerId, [e.clientX, e.clientY])
  if (ptrs.size === 1) downAt = [e.clientX, e.clientY, e.button]
  if (ptrs.size === 2) { const p = [...ptrs.values()]; downAt = null; ptrs.set('pinch', Math.hypot(p[0][0] - p[1][0], p[0][1] - p[1][1])) }
  try { R.domElement.setPointerCapture(e.pointerId) } catch (err) {}
})
R.domElement.addEventListener('pointermove', (e) => {
  if (!ptrs.has(e.pointerId)) {
    if (!downAt) {
      const _hp = pick(e.clientX, e.clientY)
      const _hk = keyOf(lastHit && lastHit.object)
      R.domElement.style.cursor = ((_hk && canType()) || (!deskMode && inLap(_hp))) ? 'pointer' : ''
    }
    return
  }
  const prev = ptrs.get(e.pointerId)
  const dx = e.clientX - prev[0], dy = e.clientY - prev[1]
  ptrs.set(e.pointerId, [e.clientX, e.clientY])
  if (ptrs.size === 3) {
    const p = [...ptrs.values()].filter(Array.isArray)
    const d = Math.hypot(p[0][0] - p[1][0], p[0][1] - p[1][1])
    if (ptrs.get('pinch')) { orbG.r = orbG.r * ptrs.get('pinch') / (d || 1); clampOrb(); camGoal = 'orbit' }
    ptrs.set('pinch', d)
    return
  }
  const pan = e.shiftKey || (downAt && downAt[2] === 2)
  if (pan) {
    const right = new THREE.Vector3().setFromMatrixColumn(CAM.matrix, 0)
    const up = new THREE.Vector3().setFromMatrixColumn(CAM.matrix, 1)
    lookG.addScaledVector(right, -dx * .0009 * orb.r).addScaledVector(up, dy * .0009 * orb.r)
    clampTgt(lookG); camGoal = 'orbit'
  } else {
    orb.th -= dx * .0052; orbG.th = orb.th
    orb.ph = orbG.ph = orb.ph - dy * .0052
    clampOrb()
    camGoal = 'orbit'
  }
  R.domElement.style.cursor = 'grabbing'
})
function endPtr(e) {
  const wasDown = downAt
  ptrs.delete(e.pointerId)
  if (ptrs.size < 3) ptrs.delete('pinch')
  R.domElement.style.cursor = ''
  if (wasDown && Math.hypot(e.clientX - wasDown[0], e.clientY - wasDown[1]) < 6 && wasDown[2] === 0) {
    lastUser = Date.now() / 1000
    const _p = pick(e.clientX, e.clientY)
    const _k = keyOf(lastHit && lastHit.object)
    if (_k && canType()) { pressCode(_k.userData.code, _k); return }
    if (!deskMode && inLap(_p)) goDesk()
  }
  downAt = null
}
R.domElement.addEventListener('pointerup', (e) => {
  endPtr(e)
  for (const [id, v] of ptrs) if (Array.isArray(v)) ptrs.set(id, [e.clientX, e.clientY])
})
R.domElement.addEventListener('pointercancel', (e) => { ptrs.delete(e.pointerId); ptrs.delete('pinch'); downAt = null })
R.domElement.addEventListener('wheel', (e) => {
  e.preventDefault()
  orbG.r = orbG.r * Math.exp(e.deltaY * .0011); clampOrb()
  camGoal = 'orbit'
}, { passive: false })
function canType() { return deskMode || (lookCur.distanceTo(DESK_TGT) < 0.55 && orb.r < 1.5) }
addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return
  if (e.key === 'Escape') { goRoom(); return }
  if (!canType()) return
  if (e.key === 'Shift') pressCode(e.code === 'ShiftRight' ? 'ShiftRight' : 'Shift')
  else if (e.key === 'ArrowLeft') pressCode('Left')
  else if (e.key === 'ArrowRight') pressCode('Right')
  else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') pressCode('UpDown')
  else pressCode(e.key)
})
const keyByCode = {}
for (const m of keyMeshes) keyByCode[m.userData.code] = m
function dipKey(code) { const m = keyByCode[code] || keyMeshes[Math.abs(String(code).length * 31) % keyMeshes.length]; if (m) m.userData.dip = 1 }
function dip(code) { dipKey(typeof code === 'string' ? code : 'Enter') }
function commitLine() {
  const t = window.__typed.trim()
  if (t.toLowerCase() === 'bougiezoe') {
    scrMsg = '→ github.com/bougiezoe'; scrMsgT = Date.now() / 1000 + 2.5
    try { window.open('https://github.com/bougiezoe', '_blank') } catch (err) {}
  }
  else if (t) { scrMsg = '$ ' + t; scrMsgT = Date.now() / 1000 + 1.6 }
  window.__typed = ''; dipKey('Enter')
}
const TOAST = document.createElement('div')
TOAST.style.cssText = 'position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:30;font-size:11px;letter-spacing:1px;color:rgba(255,255,255,.75);background:rgba(0,0,0,.45);backdrop-filter:blur(10px);padding:7px 16px;border-radius:16px;border:1px solid rgba(255,255,255,.08);transition:opacity .8s;pointer-events:none'
TOAST.textContent = '🖱️ 点击电脑走近 · 直接打字 · Esc 返回'
document.body.appendChild(TOAST)
setTimeout(() => TOAST.style.opacity = '0', 7000)
function toast(t) { TOAST.textContent = t; TOAST.style.opacity = '1'; clearTimeout(TOAST._t); TOAST._t = setTimeout(() => TOAST.style.opacity = '0', 5000) }

// ════════════════════════════════════════════
// ANIMATION
// ════════════════════════════════════════════
const CLOCK = new THREE.Clock()
const START = Date.now()
let shown = false

function anim() {
  const t = CLOCK.getElapsedTime(), rt = (Date.now()-START)/1000
  const _now = performance.now()
  const dt = anim._l ? Math.min(.05, (_now - anim._l) / 1000) : 1 / 60
  anim._l = _now

  // Lighting ramp
  const br = Math.min(1, Math.max(0, (rt-2)/5))
  const eb = 1 - Math.pow(1-br, 2)
  rA.intensity = eb * .35; rL.intensity = eb * .6; rF.intensity = eb * .2
  if (!shown && eb > .3) { document.getElementById('ui').classList.add('show'); shown = true }

  // Curtain wind
  const gust = Math.sin(t * .12) * .5 + .5
  let target = 0
  if (gust > .55) target = -(gust-.55)/.45 * .5
  const ca = pivot.rotation.y; pivot.rotation.y += (target - ca) * .03
  const verts = CG.attributes.position.array
  for (let i = 0; i < verts.length; i += 3) {
    const ox = clothO[i], oy = clothO[i+1], oz = clothO[i+2]
    const ny = (oy/(WH*1.05)+.5), ef = ox/CG.parameters.width, bm = Math.abs(pivot.rotation.y)/.5
    verts[i] = ox + Math.sin(t*3.5+ny*8+ef*5)*bm*.05*ef*.6
    verts[i+1] = oy + Math.sin(t*2.8+ny*7)*bm*.03*ef + Math.sin(t*4.2+ny*3)*bm*.015
    verts[i+2] = oz + Math.sin(t*3+ny*6+ef*4)*bm*ef*.35
  }
  CG.attributes.position.needsUpdate = true; CG.computeVertexNormals()

  // Sky
  sky.uniforms.t.value = t

  // Terminal
  updC(); TX.needsUpdate = true

  // Rain particles
  const rA2 = rain.geometry.attributes.position.array
  for (let i = 0; i < RN; i++) {
    rA2[i*3+1] -= rV[i] * .003
    if (rA2[i*3+1] < -1) { rA2[i*3] = (Math.random()-.5)*14; rA2[i*3+1] = 5; rA2[i*3+2] = -(2+Math.random()*10) }
  }
  rain.geometry.attributes.position.needsUpdate = true

  for (const m of keyMeshes) {
    if (m.userData.dip > .02) { m.userData.dip *= .86; m.position.y = m.userData.y0 - .004 * m.userData.dip }
    else if (m.userData.dip) { m.userData.dip = 0; m.position.y = m.userData.y0 }
  }
  if (camGoal) {
    let dth = (orbG.th - orb.th) % (Math.PI * 2)
    if (dth > Math.PI) dth -= Math.PI * 2
    if (dth < -Math.PI) dth += Math.PI * 2
    orb.th += dth * (1 - Math.exp(-dt * 6))
    orb.ph += (orbG.ph - orb.ph) * (1 - Math.exp(-dt * 6))
    orb.r += (orbG.r - orb.r) * (1 - Math.exp(-dt * 5))
    lookCur.lerp(lookG, 1 - Math.exp(-dt * 6))
    if (Math.abs(dth) < .002 && Math.abs(orbG.ph - orb.ph) < .002 && Math.abs(orbG.r - orb.r) < .002 && lookCur.distanceTo(lookG) < .002) camGoal = null
    applyOrbit()
  }
  CAM.lookAt(lookCur)
  // Render outdoor
  R.setRenderTarget(RT); R.render(out, CAM)
  // Render room
  R.setRenderTarget(null); GM.uniforms.uT.value = t; GM.uniforms.uR.value.set(innerWidth, innerHeight)
  R.render(RM, CAM)

  requestAnimationFrame(anim)
}
anim()

window.onresize = () => {
  const w = innerWidth, h = innerHeight
  R.setSize(w,h); CAM.aspect = w/h; CAM.updateProjectionMatrix()
  RT.setSize(w,h); GM.uniforms.uR.value.set(w,h)
}
