  for (let i = 0; i < CL.length; i++) {
    const l = CL[i]; const y = 14 + 24 + i * 14

    CX.fillStyle = l.startsWith('$') ? '#7ec894' : l.startsWith('>') ? '#6cb0e0' : '#8090a0'

  }
  if (Math.floor(cf / 25) % 2 === 0 && CL.length > 0) {
    CX.fillStyle = '#7ec894'
    CX.fillRect(12 + CL[CL.length-1].length * 7, 14 + 24 + (CL.length-1)*14 - 10, 7, 11)
  }
  CX.fillStyle = '#7ec894'; CX.font = '12px "SF Mono",monospace'
  const _inp = window.__typed || ''
  CX.fillText('> ' + _inp + (Math.floor(cf / 25) % 2 === 0 ? '▌' : ''), 12, 388)
}

  fragmentShader: 'uniform float t;varying vec3 p;float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}float f(vec2 p){float v=0.,a=.5;for(int i=0;i<4;i++){v+=a*n(p);p*=2.2;a*=.42;}return v;}void main(){vec3 d=normalize(p);float hh=d.y*.5+.5;vec3 c=mix(vec3(.8,.75,.7),vec3(.72,.82,.88),smoothstep(0.,.55,hh));c=mix(c,vec3(.45,.6,.72),smoothstep(.55,1.,hh));float hz=1.-abs(d.y);c=mix(c,vec3(.95,.88,.78),pow(hz,3.)*.18);vec2 cu=vec2(d.x*4.+t*.003,d.y*3.);float cn=f(cu);float cl=smoothstep(.35,.7,cn)*.25;c=mix(c,vec3(.85,.83,.8),cl*(1.-abs(d.y)*.4));gl_FragColor=vec4(c,1.);}',

})

function makeWoodTex() {
  const S = 256, c = document.createElement('canvas'); c.width = c.height = S
  const ctx = c.getContext('2d')
  ctx.fillStyle = '#D8C3A5'; ctx.fillRect(0, 0, S, S)
  const d = ctx.getImageData(0, 0, S, S), pix = d.data
  for (let y = 0; y < S; y++) {
    for (let x = 0; x < S; x++) {
      const i = (y * S + x) * 4
      const grain = Math.sin(x * 0.7 + y * 0.015) * 4 +
                    Math.sin(x * 1.5 + y * 0.008) * 2.5 +
                    Math.sin(x * 3.0 + y * 0.005) * 1.5
      const ring = Math.sin(y * 0.04 + Math.sin(x * 0.06) * 3) * 3
      const noise = (Math.random() - 0.5) * 2
      const shift = grain + ring + noise
      pix[i]   = Math.max(0, Math.min(255, pix[i]   + shift))
      pix[i+1] = Math.max(0, Math.min(255, pix[i+1] + shift * 0.9))
      pix[i+2] = Math.max(0, Math.min(255, pix[i+2] + shift * 0.7))
    }
  }
  ctx.putImageData(d, 0, 0)
  // Soft knots
  for (let k = 0; k < 2; k++) {
    const kx = Math.random()*S, ky = Math.random()*S, r = 4+Math.random()*6
    const g = ctx.createRadialGradient(kx,ky,0,kx,ky,r)
    g.addColorStop(0, 'rgba(190,168,140,0.25)'); g.addColorStop(.5,'rgba(200,180,155,0.1)'); g.addColorStop(1,'rgba(0,0,0,0)')
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(kx,ky,r,0,6.28); ctx.fill()
  }
  const t = new THREE.CanvasTexture(c)
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(2.5, 1.2); t.anisotropy = 4
  return t
}

  vertexShader: 'varying vec2 v;void main(){v=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1);}',
  fragmentShader: 'precision highp float;uniform sampler2D tS;uniform float uT;uniform vec2 uR;varying vec2 v;float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}float h2(vec2 p){vec2 q=fract(p*vec2(234.34,435.345));q+=dot(q,q+19.19);return fract(q.x*q.y);}void main(){vec2 uv=v;vec3 c=texture2D(tS,uv).rgb;vec2 g=vec2(20.*uR.x/uR.y,40.);vec2 id=floor(uv*g),gu=fract(uv*g)-.5;float s1=h(id),s2=h2(id);float gust=.5+.5*sin(uT*.3+sin(uT*.7)*2.);if(s1<.06+.14*gust){float sp=.03+s2*.08,r=.03+s2*.05,len=.1+s2*.16,ox=(s2-.5)*.7;float dy=fract(gu.y+uT*sp+s1*13.)-.5;vec2 rp=gu-vec2(gu.x-ox,dy*len);float el=length(rp/vec2(r,len*.35)),dm=1.-smoothstep(.4,1.0,el);if(dm>.01){vec3 rc=texture2D(tS,uv+rp*.1*dm).rgb;c=mix(c,rc,.4);c=mix(c,vec3(.85,.9,.95),dm*.06);}}c=c/(c+vec3(1.));gl_FragColor=vec4(c,1.);}',

    try {
      this.ctx = new AudioContext(); this.gain = this.ctx.createGain(); this.gain.gain.value = .04
      this.gain.connect(this.ctx.destination)
      const mk = (lo,hi,g,q) => {
        const sr = this.ctx.sampleRate, L = sr*4, b = this.ctx.createBuffer(1,L,sr), d = b.getChannelData(0)
        for (let i = 0; i < L; i++) d[i] = Math.random()*2-1
        const s = this.ctx.createBufferSource(); s.buffer = b; s.loop = true
        const bp = this.ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = (lo+hi)/2; bp.Q.value = q
        const lp = this.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = hi*1.4
        const hp = this.ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = lo*.5
        s.connect(bp); bp.connect(lp); lp.connect(hp); hp.connect(this.gain); s.start()
      }
      mk(500,1500,.4,1.2); mk(150,400,.15,.8); mk(2500,5000,.08,.6); mk(200,800,.2,.5)
      this.on = true
    } catch(e) { console.warn(e) }
  },
  setVol(v) { if (this.gain) this.gain.gain.value = v * .14 },
  toggle() { if (!this.ctx) return; this.on = !this.on; this.gain.gain.value = this.on ? .04 : 0; return this.on }
}
document.getElementById('playbtn').onclick = function() { this.textContent = AUD.toggle() ? '❚❚' : '▶' }
document.getElementById('vol').oninput = function() { AUD.setVol(this.value/100) }

// ─── DESK FOCUS: glide to the ThinkPad and type on it ───
window.__typed = ''
const RAY = new THREE.Raycaster(), PTR = new THREE.Vector2()
const HOME_POS = CAM.position.clone(), HOME_TGT = new THREE.Vector3(.05, .75, 0)
const DESK_POS = new THREE.Vector3(LX, .93, 2.02), DESK_TGT = new THREE.Vector3(LX, .855, 1.40)
const lookCur = HOME_TGT.clone()
let camGoal = null, deskMode = false
const LAPBOX = { x0: -.30, x1: .16, y0: .72, y1: 1.05, z0: 1.22, z1: 1.66 }
function inLap(p) { return p && p.x > LAPBOX.x0 && p.x < LAPBOX.x1 && p.y > LAPBOX.y0 && p.y < LAPBOX.y1 && p.z > LAPBOX.z0 && p.z < LAPBOX.z1 }
function goDesk() { deskMode = true; camGoal = { pos: DESK_POS, tgt: DESK_TGT }; toast('⌨️ 直接打字上屏 · 输入 bougiezoe 有惊喜 · Esc 回房间') }
function goRoom() { deskMode = false; window.__typed = ''; camGoal = { pos: HOME_POS, tgt: HOME_TGT } }
function pick(cx, cy) {
  PTR.set(cx / innerWidth * 2 - 1, -(cy / innerHeight) * 2 + 1)
  RAY.setFromCamera(PTR, CAM)
  const h = RAY.intersectObjects(RM.children.filter(m => !m.isPoints), true)[0]
  return h ? h.point : null
}
R.domElement.addEventListener('click', (e) => { const _p = pick(e.clientX, e.clientY); window.__lastPick = _p ? [+_p.x.toFixed(3), +_p.y.toFixed(3), +_p.z.toFixed(3)] : null; if (!deskMode && inLap(_p)) goDesk() })
R.domElement.addEventListener('pointermove', (e) => {
  if (deskMode) return
  R.domElement.style.cursor = inLap(pick(e.clientX, e.clientY)) ? 'pointer' : ''
})
addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return
  if (e.key === 'Escape') { if (deskMode) goRoom(); return }
  if (!deskMode) return
  if (e.key === 'Backspace') { window.__typed = window.__typed.slice(0, -1); dip(-1) }
  else if (e.key === 'Enter') commitLine()
  else if (e.key.length === 1 && window.__typed.length < 48) { window.__typed += e.key; dip(e.key.charCodeAt(0)) }
})
function dip(code) { const m = keyMeshes[Math.abs(code) % keyMeshes.length]; if (m) m.userData.dip = 1 }
function commitLine() {
  const t = window.__typed.trim()
  if (t.toLowerCase() === 'bougiezoe') {
    CL.push('$ bougiezoe', '> → github.com/bougiezoe')
    try { window.open('https://github.com/bougiezoe', '_blank') } catch (err) {}
  }
  else if (t) CL.push('$ ' + t)
  window.__typed = ''; dip(13)
}
const TOAST = document.createElement('div')
TOAST.style.cssText = 'position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:30;font-size:11px;letter-spacing:1px;color:rgba(255,255,255,.75);background:rgba(0,0,0,.45);backdrop-filter:blur(10px);padding:7px 16px;border-radius:16px;border:1px solid rgba(255,255,255,.08);transition:opacity .8s;pointer-events:none'
TOAST.textContent = '🖱️ 点击电脑走近 · 直接打字 · Esc 返回'
document.body.appendChild(TOAST)
setTimeout(() => TOAST.style.opacity = '0', 7000)
function toast(t) { TOAST.textContent = t; TOAST.style.opacity = '1'; clearTimeout(TOAST._t); TOAST._t = setTimeout(() => TOAST.style.opacity = '0', 5000) }

// ════════════════════════════════════════════
// ANIMATION
// ════════════════════════════════════════════
const CLOCK = new THREE.Clock()
const START = Date.now()
let shown = false

function anim() {
  const t = CLOCK.getElapsedTime(), rt = (Date.now()-START)/1000

  // Lighting ramp
  const br = Math.min(1, Math.max(0, (rt-2)/5))
  const eb = 1 - Math.pow(1-br, 2)
  rA.intensity = eb * .35; rL.intensity = eb * .6; rF.intensity = eb * .2
  if (!shown && eb > .3) { document.getElementById('ui').classList.add('show'); shown = true }

  // Curtain wind
  const gust = Math.sin(t * .12) * .5 + .5
  let target = 0
  if (gust > .55) target = -(gust-.55)/.45 * 1.25
  const ca = pivot.rotation.y; pivot.rotation.y += (target - ca) * .03
  const verts = CG.attributes.position.array
  for (let i = 0; i < verts.length; i += 3) {
    const ox = clothO[i], oy = clothO[i+1], oz = clothO[i+2]
    const ny = (oy/(WH*1.05)+.5), ef = ox/CG.parameters.width, bm = Math.abs(pivot.rotation.y)/1.25
    verts[i] = ox + Math.sin(t*3.5+ny*8+ef*5)*bm*.06*ef*.6
    verts[i+1] = oy + Math.sin(t*2.8+ny*7)*bm*.03*ef + Math.sin(t*4.2+ny*3)*bm*.015
    verts[i+2] = oz + Math.sin(t*3+ny*6+ef*4)*bm*ef
  }
  CG.attributes.position.needsUpdate = true; CG.computeVertexNormals()

  // Sky
  sky.uniforms.t.value = t

  // Terminal
  updC(); TX.needsUpdate = true

  // Rain particles
  const rA2 = rain.geometry.attributes.position.array
  for (let i = 0; i < RN; i++) {
    rA2[i*3+1] -= rV[i] * .003
    if (rA2[i*3+1] < -1) { rA2[i*3] = (Math.random()-.5)*14; rA2[i*3+1] = 5; rA2[i*3+2] = -(2+Math.random()*10) }
  }
  rain.geometry.attributes.position.needsUpdate = true

  for (const m of keyMeshes) {
    if (m.userData.dip > .02) { m.userData.dip *= .86; m.position.y = m.userData.y0 - .004 * m.userData.dip }
    else if (m.userData.dip) { m.userData.dip = 0; m.position.y = m.userData.y0 }
  }
  if (camGoal) {
    CAM.position.lerp(camGoal.pos, .055); lookCur.lerp(camGoal.tgt, .07)
    if (CAM.position.distanceTo(camGoal.pos) < .004) camGoal = null
  }
  CAM.lookAt(lookCur)
  // Render outdoor
  R.setRenderTarget(RT); R.render(out, CAM)
  // Render room
  R.setRenderTarget(null); GM.uniforms.uT.value = t; GM.uniforms.uR.value.set(innerWidth, innerHeight)
  R.render(RM, CAM)

  requestAnimationFrame(anim)
}
anim()

window.onresize = () => {
  const w = innerWidth, h = innerHeight
  R.setSize(w,h); CAM.aspect = w/h; CAM.updateProjectionMatrix()
  RT.setSize(w,h); GM.uniforms.uR.value.set(w,h)
}

document.addEventListener('click', () => AUD.init(), { once: true })
document.addEventListener('touchstart', () => AUD.init(), { once: true })
console.log('✅ Loaded')

} catch(e) { console.error(e); E(e.message) }
</script>
